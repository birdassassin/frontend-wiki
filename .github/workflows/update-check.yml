name: Weekly Update Check

on:
  schedule:
    # 每周一上午 10:00 (UTC) 运行，即北京时间 18:00
    - cron: '0 10 * * 1'
  workflow_dispatch:  # 允许手动触发

jobs:
  check-updates:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Run update checker
        run: node scripts/update-checker.js
      
      - name: Check if there are updates
        id: check-changes
        run: |
          git add -A
          if git diff --staged --quiet; then
            echo "has_updates=false" >> $GITHUB_OUTPUT
          else
            echo "has_updates=true" >> $GITHUB_OUTPUT
          fi
      
      - name: Commit and push changes
        if: steps.check-changes.outputs.has_updates == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          git commit -m "chore: auto update version check report" || exit 0
          git push
      
      - name: Create issue if updates needed
        if: steps.check-changes.outputs.has_updates == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('scripts/update-report.md', 'utf8');
            
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `📦 知识库更新检查 - ${new Date().toISOString().split('T')[0]}`,
              body: report,
              labels: ['update', 'automated']
            });

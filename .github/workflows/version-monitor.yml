name: Version Monitor

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run version monitor
        run: node scripts/version-monitor.js

      - name: Create issue if outdated
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const result = JSON.parse(fs.readFileSync('./version-report.json', 'utf-8'));
            
            const outdated = result.filter(r => r.status === 'outdated');
            
            if (outdated.length > 0) {
              const title = `📦 版本更新提醒 - ${new Date().toISOString().split('T')[0]}`;
              const body = `以下文档版本已落后于最新版本，请及时更新：\n\n${outdated.map(r => `- \`${r.package}\`: 文档版本 ${r.docVersion} → 最新版本 ${r.npmVersion}`).join('\n')}`;
              
              github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: ['version-update', 'documentation']
              });
            }
